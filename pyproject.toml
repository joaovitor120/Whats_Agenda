[project]
name = "whats-agenda"
version = "0.1.0"
description = "Assistente de agenda via WhatsApp"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2",
  "redis>=5,<7", "celery[redis]>=5.4,<6", "httpx>=0.27,<1",
  "openai>=1.50,<3", "cryptography>=50,<51", "python-dateutil>=2.9,<3",
  "dateparser>=1.2,<2", "mutagen>=1.47,<2", "structlog>=24.4,<27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1", "mypy>=1.11,<2", "aiosqlite>=0.20,<1", "pip-audit>=2.10,<3", "bandit>=1.8,<2", "pip-tools>=7.5,<8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
